name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci
        working-directory: app
      - name: Tests (no keys)
        run: |
          set -o pipefail
          npm run test:coverage | tee coverage.log
      - name: Coverage shown in the README, within 1 point of this run
        run: node scripts/coverage.mjs --check coverage.log
      - name: Time for this job
        if: always()
        run: echo "tests took $(( $(date +%s) - T0 )) s"
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci
        working-directory: app
      - name: Every link, path and npm script the docs name exists
        run: npm run check:docs
      - name: Docs reviewed in the last 90 days (warning only)
        run: node scripts/reviewed.mjs
      - name: Public text (no em dashes, no banned words)
        run: npm run check:text
      - name: No keys or tokens in tracked files
        run: npm run check:secrets
      - name: Numbers written by hand (eval/claims.json) still match the code they describe
        run: node scripts/claims.mjs
      - name: Time for this job
        if: always()
        run: echo "checks took $(( $(date +%s) - T0 )) s"
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci
        working-directory: app
      - name: Type check, app build, demo build, .ehpk
        working-directory: app
        run: |
          npx tsc --noEmit
          npx vite build
          npx vite build --mode demo
          npx evenhub pack app.json dist -o gloz.ehpk --sdk-ver "$(node -p "require('./package.json').dependencies['@evenrealities/even_hub_sdk']")"
      - name: Time for this job
        if: always()
        run: echo "build took $(( $(date +%s) - T0 )) s"
  results:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci
        working-directory: app
      - name: Results and README numbers match the committed run
        run: |
          node eval/score.mjs --check
          node scripts/readme.mjs --check
          # Speed and data budget: over 10% slower or heavier than eval/results/time.json fails.
          node eval/time.mjs --check
          # The held-out set is the one whose digest the protocol records.
          grep -q "sha256 eval/set/heldout.json: $(sha256sum eval/set/heldout.json | cut -d' ' -f1)" eval/PROTOCOL.md
      - name: Time for this job
        if: always()
        run: echo "results took $(( $(date +%s) - T0 )) s"
  setup:
    # The README setup steps, run the way a judge would: install, build, pack, start, pair.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: app
      - name: Setup checked as the README says
        run: npm run check:setup
  evaluation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fonts and the simulator's web view
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-core fonts-noto-cjk libwebkit2gtk-4.1-0 libgtk-3-0
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: npm install -g @evenrealities/evenhub-simulator@0.9.5
      - name: Evaluation in the simulator, one held-out message per script, each checked against eval/results/heldout.json
        run: xvfb-run -a node eval/run.mjs heldout --per-script=1 --out=ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-ci
          path: eval/results/ci.*
