name: Daily release
on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  new:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.new.outputs.skip }}
      last: ${{ steps.new.outputs.last }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Anything new since the last release?
        id: new
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$last" ] && [ -z "$(git log "$last"..HEAD --oneline)" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          echo "last=$last" >> "$GITHUB_OUTPUT"
  build:
    needs: new
    if: needs.new.outputs.skip != '1'
    uses: ./.github/workflows/build-ehpk.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
  publish:
    needs: [new, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: gloz-ehpk
          path: app
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="day-$(date -u +%Y-%m-%d)"
          # A second release on the same day is named by its build.
          if gh release view "$tag" > /dev/null 2>&1; then tag="build-${GITHUB_SHA::7}"; fi
          if gh release view "$tag" > /dev/null 2>&1; then echo "Release $tag already exists"; exit 0; fi
          range="${{ needs.new.outputs.last }}"; [ -n "$range" ] && range="$range..HEAD" || range="HEAD"
          git log $range --pretty='- %s' > notes.md
          gh release create "$tag" app/gloz.ehpk --title "Gloz $(date -u +%d\ %b\ %Y)" --notes-file notes.md --target "$GITHUB_SHA"
